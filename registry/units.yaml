    title: { ru: Градус угла, en: Degree of angle }
  - code: "/min"
    title: { ru: В минуту, en: Per minute }
  - code: s
    title: { ru: Секунда, en: Second }
  - code: dB
    title: { ru: Децибел, en: Decibel }
