    title: { ru: Частиц на миллион, en: Parts per million }
  - code: "ug/m3"
    title: { ru: Микрограмм на кубический метр, en: Microgram per cubic meter }
  - code: V
    title: { ru: Вольт, en: Volt }
  - code: A
    title: { ru: Ампер, en: Ampere }
  - code: W
    title: { ru: Ватт, en: Watt }
  - code: Wh
    title: { ru: Ватт-час, en: Watt-hour }
  - code: Hz
    title: { ru: Герц, en: Hertz }
  - code: N
