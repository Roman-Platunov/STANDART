    title: { ru: Градус Цельсия, en: Degree Celsius }
  - code: "%"
    title: { ru: Процент, en: Percent }
  - code: hPa
    title: { ru: Гектопаскаль, en: Hectopascal }
  - code: lx
    title: { ru: Люкс, en: Lux }
